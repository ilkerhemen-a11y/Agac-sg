name: Build AgaçİSG Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check TypeScript
        run: npm run typecheck
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - name: Verify Android namespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('android/app/build.gradle')
          content = path.read_text()
          content, count = re.subn(r'namespace\\s+["\\'][^"\\']+["\\']', 'namespace "com.agacisg.app"', content, count=1)
          if count != 1:
              raise SystemExit('Could not find the Android namespace in android/app/build.gradle')
          path.write_text(content)
          print('Android namespace forced to com.agacisg.app')
          PY
          grep -n 'namespace' android/app/build.gradle
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agac-isg-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
