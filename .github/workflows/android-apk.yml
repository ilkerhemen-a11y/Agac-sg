name: Build AgaçİSG Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check TypeScript
        run: npm run typecheck
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - name: Verify Android namespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          lines = path.read_text().splitlines()
          found = False
          for index, line in enumerate(lines):
              if line.strip().startswith('namespace '):
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[index] = indent + 'namespace "com.agacisg.app"'
                  found = True
                  break
          if not found:
              raise SystemExit('Could not find namespace in android/app/build.gradle')
          path.write_text('\n'.join(lines) + '\n')
          print('Android namespace forced to com.agacisg.app')
          PY
          grep -n 'namespace' android/app/build.gradle
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agac-isg-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
