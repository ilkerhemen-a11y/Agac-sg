name: Build AgaçİSG Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check TypeScript
        run: npm run typecheck
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - name: Verify Android namespace and generated config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          content = path.read_text()
          lines = content.splitlines()
          found = False
          for index, line in enumerate(lines):
              if line.strip().startswith('namespace '):
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[index] = indent + 'namespace "com.agacisg.app"'
                  found = True
                  break
          if not found:
              raise SystemExit('Could not find namespace in android/app/build.gradle')
          content = '\n'.join(lines) + '\n'
          if 'buildFeatures {' not in content:
              marker = 'android {'
              if marker not in content:
                  raise SystemExit('Could not find android block in android/app/build.gradle')
              content = content.replace(marker, marker + '\n    buildFeatures {\n        buildConfig = true\n    }', 1)
          elif 'buildConfig = true' not in content and 'buildConfig true' not in content:
              content = content.replace('buildFeatures {', 'buildFeatures {\n        buildConfig = true', 1)
          path.write_text(content)
          print('Namespace set and BuildConfig generation enabled')
          PY
          grep -nE 'namespace|buildFeatures|buildConfig' android/app/build.gradle
          echo '--- MainActivity package ---'
          sed -n '1,45p' android/app/src/main/java/com/agacisg/app/MainActivity.kt
          echo '--- MainApplication package ---'
          sed -n '1,55p' android/app/src/main/java/com/agacisg/app/MainApplication.kt
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agac-isg-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
