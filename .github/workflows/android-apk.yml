name: Build AgaçİSG Android APK (embedded JS bundle)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check TypeScript
        run: npm run typecheck
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - name: Fix Android namespace and generated Kotlin packages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          namespace = "com.agacisg.app"
          gradle = Path("android/app/build.gradle")
          lines = gradle.read_text().splitlines()
          found = False
          for index, line in enumerate(lines):
              if line.strip().startswith("namespace "):
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[index] = indent + f'namespace "{namespace}"'
                  found = True
                  break
          if not found:
              raise SystemExit("Could not find namespace in android/app/build.gradle")

          content = "\n".join(lines) + "\n"
          if "buildFeatures {" not in content:
              content = content.replace(
                  "android {",
                  "android {\n    buildFeatures {\n        buildConfig = true\n    }",
                  1,
              )
          elif "buildConfig = true" not in content and "buildConfig true" not in content:
              content = content.replace(
                  "buildFeatures {",
                  "buildFeatures {\n        buildConfig = true",
                  1,
              )
          gradle.write_text(content)

          package_files = [
              Path("android/app/src/main/java/com/agacisg/app/MainActivity.kt"),
              Path("android/app/src/main/java/com/agacisg/app/MainApplication.kt"),
          ]
          for file in package_files:
              if not file.exists():
                  raise SystemExit(f"Expected generated Kotlin file is missing: {file}")
              source = file.read_text()
              lines = source.splitlines()
              if not lines or not lines[0].startswith("package "):
                  raise SystemExit(f"Could not find package declaration in {file}")
              lines[0] = f"package {namespace}"
              file.write_text("\n".join(lines) + "\n")
              print(f"Corrected package declaration: {file}")

          print("Android namespace and BuildConfig generation configured")
          PY
          grep -nE 'namespace|buildFeatures|buildConfig' android/app/build.gradle
          head -n 2 android/app/src/main/java/com/agacisg/app/MainActivity.kt
          head -n 2 android/app/src/main/java/com/agacisg/app/MainApplication.kt
      - name: Build installable release APK with embedded JavaScript bundle
        run: cd android && ./gradlew assembleRelease
      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/release/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agac-isg-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
