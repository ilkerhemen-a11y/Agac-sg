name: Build AgaçİSG Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Typecheck and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run typecheck

      - name: Convert app icon SVG to PNG
        run: |
          npm install --no-save sharp
          node -e "require('sharp')('assets/agacisg-icon.svg').resize(1024,1024).png().toFile('assets/agacisg-icon.png').then(()=>console.log('Android-compatible PNG icon generated'))"

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android

      - name: Fix Android namespace and BuildConfig generation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          namespace = "com.agacisg.app"
          gradle = Path("android/app/build.gradle")
          lines = gradle.read_text().splitlines()
          for index, line in enumerate(lines):
              if line.strip().startswith("namespace "):
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[index] = indent + f'namespace "{namespace}"'
                  break
          else:
              raise SystemExit("Could not find namespace in android/app/build.gradle")

          content = "\n".join(lines) + "\n"
          if "buildFeatures {" not in content:
              content = content.replace(
                  "android {",
                  "android {\n    buildFeatures {\n        buildConfig = true\n    }",
                  1,
              )
          elif "buildConfig = true" not in content and "buildConfig true" not in content:
              content = content.replace(
                  "buildFeatures {",
                  "buildFeatures {\n        buildConfig = true",
                  1,
              )
          gradle.write_text(content)

          for file in (
              Path("android/app/src/main/java/com/agacisg/app/MainActivity.kt"),
              Path("android/app/src/main/java/com/agacisg/app/MainApplication.kt"),
          ):
              if not file.exists():
                  raise SystemExit(f"Expected generated Kotlin file is missing: {file}")
              source_lines = file.read_text().splitlines()
              if not source_lines or not source_lines[0].startswith("package "):
                  raise SystemExit(f"Could not find package declaration in {file}")
              source_lines[0] = f"package {namespace}"
              file.write_text("\n".join(source_lines) + "\n")
              print(f"Corrected package declaration: {file}")

          print("Android namespace and BuildConfig generation configured")
          PY
          grep -nE 'namespace|buildFeatures|buildConfig' android/app/build.gradle
          head -n 2 android/app/src/main/java/com/agacisg/app/MainActivity.kt
          head -n 2 android/app/src/main/java/com/agacisg/app/MainApplication.kt

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgacISG-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
